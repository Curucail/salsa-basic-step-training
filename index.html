<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salsa On2 Feet</title>
<meta name="description" content="Tu Con Él by Frankie Ruiz with an animation of the salsa on2 basic step, driven by hand-annotated beats.">
<style>
  :root {
    --bg: #f6f3ee; --fg: #1d1a17; --muted: #6d655d; --panel: #ffffff; --line: #ddd5ca;
    --accent: #d8392b; --accent-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17140f; --fg: #f1ece4; --muted: #a39a8f; --panel: #221e18; --line: #3a342b;
      --accent: #ef6a4d; --accent-fg: #1a0f0b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .video { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           padding: 12px 14px; margin-top: 14px; }
  .panel h2 { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
              margin: 0 0 8px; font-weight: 600; }
  .mix { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px 18px; }
  label { display: grid; gap: 2px; font-size: .9rem; }
  .stage { position: relative; }
  .viewbtn { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
             background: rgba(0, 0, 0, .4); color: #fff; border-color: rgba(255, 255, 255, .4); }
  .viewbtn:hover { background: rgba(0, 0, 0, .6); }
  label .row { display: flex; justify-content: space-between; }
  label .val { color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select, button { font: inherit; padding: 5px 9px; border-radius: 7px; border: 1px solid var(--line);
                   background: var(--bg); color: var(--fg); cursor: pointer; }
  button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

  .stage { margin-top: 14px; background: #2a1d14; border-radius: 10px; overflow: hidden; }
  canvas { display: block; width: 100%; height: auto; }
  .counts { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 10px; }
  .counts span { text-align: center; padding: 6px 0; border-radius: 7px; border: 1px solid var(--line);
                 background: var(--panel); font-weight: 600; font-variant-numeric: tabular-nums;
                 transition: background .08s, color .08s; }
  .counts span.now { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .status { color: var(--muted); font-size: .85rem; margin: 8px 0 0; }
  .status:empty { display: none; }
</style>
</head>
<body>
<main>
  <h1>Salsa On2 Feet</h1>
  <p class="sub">Tu Con Él · Frankie Ruiz &mdash; the feet follow hand-annotated beats.</p>

  <div class="video"><div id="player"></div></div>

  <div class="stage">
    <canvas id="stage" width="640" height="610" aria-label="Animation of the salsa on2 basic step"></canvas>
    <button id="swapView" class="viewbtn" type="button">View as follower</button>
  </div>
  <div class="counts" id="counts" aria-hidden="true"></div>

  <section class="panel" aria-label="Controls">
    <h2>Controls</h2>
    <div class="mix">
      <label>
        <span class="row"><span>Music</span><span class="val" id="musicVal">100%</span></span>
        <input id="music" type="range" min="0" max="100" value="100">
      </label>
      <label>
        <span class="row"><span>Beat clicks</span><span class="val" id="clickVal">70%</span></span>
        <input id="click" type="range" min="0" max="100" value="70">
      </label>
      <label>
        <span class="row"><span>Clicks on</span></span>
        <select id="mode">
          <option value="steps">every step (1 accented)</option>
          <option value="ones">1 and 5 only</option>
        </select>
      </label>
    </div>
    <p class="status" id="audioStatus" role="status"></p>
  </section>
</main>

<script src="beats.js"></script>
<script src="dance.js"></script>
<script src="app.js"></script>
</body>
</html>
